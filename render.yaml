services:
  - type: web
    name: wakaba
    runtime: docker
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        value: file:/app/prisma/learning.db
      - key: TURSO_DATABASE_URL
        value: ""
      - key: TURSO_AUTH_TOKEN
        value: ""
